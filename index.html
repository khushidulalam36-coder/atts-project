    // ─── WEBSOCKET CONNECTIONS ──────────────────────────────────
    function connectBinanceWS() {
        if (binanceWS && (binanceWS.readyState === WebSocket.OPEN || binanceWS.readyState === WebSocket
                .CONNECTING)) return;
        if (binanceWS) { try { binanceWS.close(); } catch(e) {} }
        const streams = SYMBOLS.map(s => s.toLowerCase() + '@kline_1m').join('/');
        const url = 'wss://stream.binance.com:9443/ws/' + streams;
        try {
            binanceWS = new WebSocket(url);
            binanceWS.onopen = () => { wsConnected = true;
                wsReconnectAttempt = 0; };
            binanceWS.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.e === 'kline') {
                        const k = data.k;
                        const symbol = data.s.toUpperCase();
                        const candle = {
                            time: Math.floor(k.t / 1000),
                            open: +k.o,
                            high: +k.h,
                            low: +k.l,
                            close: +k.c,
                            volume: +k.v
                        };
                        const safeCandle = sanitizeCandle(candle);
                        if (!safeCandle) return;
                        if (simLastPrices[symbol]) {
                            simPrevClosePrices[symbol] = simLastPrices[symbol];
                        }
                        simLastPrices[symbol] = safeCandle.close;
                        lastBinancePrice[symbol] = safeCandle.close;
                        updateMobileTopBar();
                        updateWatchlistPrices();
                        if (symbol === simCurrentSymbol && simCandleSeries && simCurrentCandle) {
                            const currentCandle = simCurrentCandle;
                            const priceChange = Math.abs(safeCandle.close - currentCandle.close);
                            const highChange = Math.abs(safeCandle.high - currentCandle.high);
                            const lowChange = Math.abs(safeCandle.low - currentCandle.low);
                            const threshold = (currentCandle.close || 1) * 0.0005;
                            if (priceChange > threshold || highChange > threshold || lowChange > threshold) {
                                const idx = simAllCandles.findIndex(c => c.time === safeCandle.time);
                                if (idx >= 0) simAllCandles[idx] = safeCandle;
                                else { simAllCandles.push(safeCandle); if (simAllCandles.length > 10000)
                                        simAllCandles = simAllCandles.slice(-10000); }
                                simCurrentCandle = safeCandle;
                                safeUpdateCandle(safeCandle, 'WS full');
                                updateAllIndicators();
                                checkAndExecuteSLTP();
                                updateSimUI();
                            } else {
                                currentCandle.close = safeCandle.close;
                                currentCandle.volume = safeCandle.volume;
                                safeUpdateCandle(currentCandle, 'WS partial');
                                updateAllIndicators();
                                updateSimUI();
                            }
                        }
                    }
                } catch (e) {}
            };
            binanceWS.onclose = () => {
                wsConnected = false;
                if (binanceReconnectTimer) clearTimeout(binanceReconnectTimer);
                binanceReconnectTimer = scheduleReconnect(connectBinanceWS);
            };
            binanceWS.onerror = () => { if (binanceWS) binanceWS.close(); };
        } catch (e) {}
    }

    function disconnectBinanceWS() {
        if (binanceWS) { try { binanceWS.close(); } catch (e) {} }
        if (binanceReconnectTimer) { clearTimeout(binanceReconnectTimer);
            binanceReconnectTimer = null; }
        wsConnected = false;
        wsReconnectAttempt = 0;
    }

    function scheduleReconnect(fn) {
        const delay = Math.min(1000 * Math.pow(2, wsReconnectAttempt), maxReconnectDelay);
        wsReconnectAttempt++;
        return setTimeout(fn, delay);
    }

    function connectServerWS() {
        if (serverWS && (serverWS.readyState === WebSocket.OPEN || serverWS.readyState === WebSocket
                .CONNECTING)) return;
        if (serverWS) { try { serverWS.close(); } catch(e) {} }
        const host = location.hostname === 'localhost' ? 'localhost:5000' : 'atts-project.onrender.com';
        try {
            serverWS = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + host);
            serverWS.onopen = () => { wsConnectedServer = true;
                serverReconnectAttempt = 0; };
            serverWS.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    if (d.type === 'price_update' && d.prices) {
                        Object.keys(d.prices).forEach(sym => {
                            if (simLastPrices[sym]) simPrevClosePrices[sym] = simLastPrices[sym];
                            simLastPrices[sym] = d.prices[sym];
                        });
                        updateMobileTopBar();
                        updateWatchlistPrices();
                    }
                } catch (err) {}
            };
            serverWS.onclose = () => { wsConnectedServer = false;
                if (serverReconnectTimer) clearTimeout(serverReconnectTimer);
                serverReconnectTimer = scheduleServerReconnect(connectServerWS); };
            serverWS.onerror = () => { wsConnectedServer = false;
                if (serverReconnectTimer) clearTimeout(serverReconnectTimer);
                serverReconnectTimer = scheduleServerReconnect(connectServerWS); };
        } catch (e) { if (serverReconnectTimer) clearTimeout(serverReconnectTimer);
            serverReconnectTimer = scheduleServerReconnect(connectServerWS); }
    }

    function disconnectServerWS() {
        if (serverWS) { try { serverWS.close(); } catch(e) {}
            serverWS = null;
            wsConnectedServer = false; }
        if (serverReconnectTimer) { clearTimeout(serverReconnectTimer);
            serverReconnectTimer = null; }
        serverReconnectAttempt = 0;
    }

    function scheduleServerReconnect(fn) {
        const delay = Math.min(1000 * Math.pow(2, serverReconnectAttempt), maxReconnectDelay);
        serverReconnectAttempt++;
        return setTimeout(fn, delay);
    }

    // ─── WATCHLIST PRICES ──────────────────────────────────────
    function updateWatchlistPrices() {
        const items = document.querySelectorAll('.mt5-market-item');
        items.forEach(el => {
            const symEl = el.querySelector('.symbol');
            if (!symEl) return;
            const sym = symEl.textContent;
            const price = simLastPrices[sym] || simBasePrices[sym] || 0;
            const prevClose = simPrevClosePrices[sym] || simBasePrices[sym] || price;
            const priceEl = el.querySelector('.price');
            if (priceEl) priceEl.textContent = '$' + (typeof price === 'number' ? price.toFixed(4) :
                price);
            const changeEl = el.querySelector('.change');
            if (changeEl) {
                const change = prevClose > 0 ? ((price - prevClose) / prevClose * 100) : 0;
                changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                changeEl.className = 'change ' + (change >= 0 ? 'up' : 'down');
            }
        });
    }

    function updateMobileTopBar() {
        const price = simLastPrices[simCurrentSymbol] || simBasePrices[simCurrentSymbol] || 0;

    // ─── CLEANUP ──────────────────────────────────────────────────
    function cleanupSimIntervals() {
        if (simPriceIntervalId) clearInterval(simPriceIntervalId);
        if (simCandleCloseIntervalId) clearInterval(simCandleCloseIntervalId);
        if (simResizeObserver) simResizeObserver.disconnect();
        if (window._mobileResizeObs) { window._mobileResizeObs.disconnect();
            window._mobileResizeObs = null; }
        if (chartInitRetryTimer) clearTimeout(chartInitRetryTimer);
        if (chartVisibilityHandler) { document.removeEventListener('visibilitychange',
                chartVisibilityHandler);
            chartVisibilityHandler = null; }
        if (window._visibilityHandler) document.removeEventListener('visibilitychange', window
            ._visibilityHandler);
        simPriceIntervalId = null;
        simCandleCloseIntervalId = null;
        simResizeObserver = null;
        chartInitRetryTimer = null;
        chartInitInProgress = false;
        if (window._chartCleanup) window._chartCleanup();
    }

    function resetChart() {
        cleanupSimIntervals();
        if (simChart) { try { simChart.remove(); } catch (e) {}
            simChart = null;
            simCandleSeries = null;
            simVolumeSeries = null;
            simIndicatorSeries = {}; }
        simAllCandles = [];
        simCurrentCandle = null;
        activeIndicators = {};
        simIndicatorSeries = {};

        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));

        if (chartDiv) { chartDiv.innerHTML = '<div class="chart-loading" id="chartLoading">Loading chart...</div>'; }
        if (chartInitRetryTimer) clearTimeout(chartInitRetryTimer);
        chartInitRetryTimer = setTimeout(initChart, 100);
    }

    // ─── BACKGROUND ENGINE ──────────────────────────────────────
    let bgEngineInterval = null;

    function startBackgroundEngine() {
        if (bgEngineInterval) clearInterval(bgEngineInterval);
        bgEngineInterval = setInterval(() => {
            checkAndExecuteSLTP();
            checkPendingOrders();
            const now = Date.now();
            if (now - lastHistoryReset > 86400000) {
                const cutoff = now - 86400000;
                portfolio.transactions = portfolio.transactions.filter(t => {
                    if (t.time && typeof t.time === 'string') {
                        const ts = new Date(t.time).getTime();
                        if (!isNaN(ts)) return ts > cutoff;
                    }
                    return true;
                });
                lastHistoryReset = now;
                savePortfolioToStorage();
                updateHistoryUI();
            }
        }, 3000);
    }

    function stopBackgroundEngine() {
        if (bgEngineInterval) { clearInterval(bgEngineInterval);
            bgEngineInterval = null; }
    }

    // ─── CHAPTER PROGRESS ──────────────────────────────────────────
    function calcChapterProgress() {
        let total = 0,
            completed = 0;
        subjects.forEach(s => {
            const lessons = s.lessons || [];
            if (lessons.length === 0) return;
            total++;
            const allDone = lessons.every(l => (userProgress[l.id] || 0) >= 100);
            if (allDone) completed++;
        });
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
        return { total, completed, percent };
    }

    function calcLessonProgress(subjectId) {
        const subj = subjects.find(s => s.id === subjectId);
        if (!subj) return { total: 0, completed: 0, percent: 0 };
        const lessons = subj.lessons || [];
        const total = lessons.length;
        const completed = lessons.filter(l => (userProgress[l.id] || 0) >= 100).length;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
        return { total, completed, percent };
    }

                        <span style="flex:1;">${t(s.names)}</span>

                            return `<div class="lesson-card-glass" data-id="${l.id}">
                                <div class="lesson-info-glass">
                                    <span class="lesson-title-glass">📄 ${t(l.titles)}</span>

                                        ${prog >= 100 ? '<span class="badge-glass badge-completed-glass">✓ Done</span>' : ''}
                                        ${quizBadge}
                                        ${bookmarks.has(l.id) ? '<span style="color:var(--accent);">⭐</span>' : ''}

    // ─── QUIZ TAB RENDER ──────────────────────────────────────────
    function renderQuizTabGlass(container, lesson, lessonId) {
        if (!lesson.quiz || lesson.quiz.length === 0) {
            container.innerHTML =
                '<div style="padding:12px;text-align:center;background:rgba(245,158,11,0.08);border-radius:12px;font-size:0.75rem;border:1px solid rgba(245,158,11,0.15);">🧠 No quiz available.</div>';
            return;
        }
        const qs = quizScores[lessonId];
        if (qs) {
            const total = lesson.quiz.reduce((s, q) => s + (q.points || 5), 0);
            const percent = total > 0 ? Math.round((qs.score / total) * 100) : 0;
            container.innerHTML = `
                        <div class="quiz-container-glass">
                            <h3 style="text-align:center;font-size:0.85rem;">${qs.passed ? '🎉' : '📚'} Quiz Result</h3>
                            <div style="text-align:center;font-size:1.8rem;font-weight:800;color:${qs.passed ? 'var(--success)' : 'var(--danger)'};">${qs.score}/${total} (${percent}%)</div>
                            <p style="text-align:center;font-size:0.75rem;">Pass mark: ${lesson.quizPassScore || 80}% — ${qs.passed ? 'PASSED' : 'FAILED'}</p>
                            <div style="text-align:center;margin-top:6px;"><button class="btn btn-primary" id="retryQuizBtn">🔄 Retry Quiz</button></div>
                        </div>`;
            document.getElementById('retryQuizBtn').onclick = async () => {
                try {
                    await apiFetch('/quiz/reset/' + lessonId, { method: 'POST' });
                    delete quizScores[lessonId];
                    showLessonDetail(lessonId);
                    setTimeout(() => {
                        const qt = document.querySelector('.tab-glass[data-tab="quiz"]');
                        if (qt) qt.click();
                    }, 100);
                } catch (e) { showToast('⚠️ ' + e.message); }
            };
            return;
        }
        let answers = new Array(lesson.quiz.length).fill(null);
        let qIdx = 0;

        function renderQuestion() {
            const q = lesson.quiz[qIdx];
            container.innerHTML = `
                        <div class="quiz-container-glass">
                            <p style="font-size:0.6rem;color:var(--text-muted);">Question ${qIdx+1} of ${lesson.quiz.length} | Points: <strong>${q.points || 5}</strong></p>
                            <p class="quiz-question-glass">${t(q.question)}</p>
                            <div id="quizOptionsGlass"></div>
                            <div style="display:flex;justify-content:space-between;margin-top:8px;gap:4px;">
                                <button class="btn btn-outline btn-sm" id="prevQBtn" ${qIdx === 0 ? 'disabled' : ''}>← Prev</button>
                                <button class="btn btn-primary btn-sm" id="nextQBtn" ${qIdx >= lesson.quiz.length-1 ? 'style="display:none;"' : ''}>Next →</button>
                                <button class="btn btn-success btn-sm" id="submitQuizBtn" ${qIdx < lesson.quiz.length-1 ? 'style="display:none;"' : ''}>✅ Submit Quiz</button>
                            </div>
                        </div>`;
            const optsDiv = document.getElementById('quizOptionsGlass');
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-glass' + (answers[qIdx] === opt.id ? ' selected' : '');
                btn.textContent = t(opt.text);
                btn.style.fontSize = '0.7rem';
                btn.onclick = () => {
                    answers[qIdx] = opt.id;
                    optsDiv.querySelectorAll('.quiz-option-glass').forEach(b => b.classList.remove(
                        'selected'));
                    btn.classList.add('selected');
                };
                optsDiv.appendChild(btn);
            });
            document.getElementById('prevQBtn').onclick = () => { if (qIdx > 0) { qIdx--;
                    renderQuestion(); } };
            document.getElementById('nextQBtn').onclick = () => { if (qIdx < lesson.quiz.length - 1) { qIdx++;
                    renderQuestion(); } };
            document.getElementById('submitQuizBtn').onclick = () => submitQuizGlass(container, lesson, lessonId,
                answers);
        }
        renderQuestion();
    }

    async function submitQuizGlass(container, lesson, lessonId, answers) {
        const unanswered = answers.findIndex(a => a === null);
        if (unanswered !== -1) { showToast('⚠️ Please answer question ' + (unanswered + 1)); return; }
        let earned = 0;
        let totalPoints = 0;
        lesson.quiz.forEach((q, i) => {
            totalPoints += (q.points || 5);
            if (answers[i] === q.correct) earned += (q.points || 5);
        });
        const passThreshold = lesson.quizPassScore || 80;
        const percent = totalPoints > 0 ? (earned / totalPoints) * 100 : 0;
        const passed = percent >= passThreshold;
        try {
            await apiFetch('/quiz/submit', { method: 'POST', body: JSON.stringify({ lessonId, score: earned,
                    passed }) });
            quizScores[lessonId] = { score: earned, passed };
            showToast('📝 Score: ' + earned + '/' + totalPoints + ' (' + Math.round(percent) + '%) — ' + (
                passed ? 'Passed! 🎉' : 'Failed. Try again! 💪'));
            showLessonDetail(lessonId);
            setTimeout(() => {
                const qt = document.querySelector('.tab-glass[data-tab="quiz"]');
                if (qt) qt.click();
            }, 100);
        } catch (e) { showToast('⚠️ ' + e.message); }
    }

    // ─── TTS SETUP ──────────────────────────────────────────────
    function setupTTSGlass(lessonId) {
        const subj = subjects.find(s => s.id === selectedSubjectId);
        const les = subj?.lessons?.find(l => l.id === lessonId);
        if (!les) return;
        const txt = les.contents ? stripHtml(t(les.contents)) : '';
        let utterance = null;
        let isPaused = false;

        function speak() {
            if (!txt) { showToast('⚠️ No text to speak'); return; }
            if (window.speechSynthesis) {
                if (utterance && !isPaused) window.speechSynthesis.cancel();
                if (isPaused && utterance) {
                    window.speechSynthesis.resume();
                    isPaused = false;
                    showToast('▶️ Resumed');
                    return;
                }
                utterance = new SpeechSynthesisUtterance(txt);
                const speed = parseFloat(document.getElementById('speedSlider')?.value || 1);
                utterance.rate = speed;
                const langMap = { 'bn': 'bn-BD', 'hi': 'hi-IN', 'en': 'en-US' };
                utterance.lang = langMap[currentLang] || 'en-US';
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                } else {
                    const voices = window.speechSynthesis.getVoices();
                    const langPrefix = currentLang === 'bn' ? 'bn' : currentLang === 'hi' ? 'hi' : 'en';
                    const femaleVoices = voices.filter(v =>
                        v.lang.toLowerCase().includes(langPrefix) &&
                        (v.name.toLowerCase().includes('female') ||
                            v.name.toLowerCase().includes('samantha') ||
                            v.name.toLowerCase().includes('victoria') ||
                            v.name.toLowerCase().includes('zira') ||
                            v.name.toLowerCase().includes('heather') ||
                            v.name.toLowerCase().includes('sarah') ||
                            v.name.toLowerCase().includes('karen') ||
                            v.name.toLowerCase().includes('emma') ||
                            v.name.toLowerCase().includes('allison'))
                    );
                    if (femaleVoices.length > 0) {
                        utterance.voice = femaleVoices[0];
                    } else if (voices.length > 0) {
                        utterance.voice = voices[0];
                    }
                }
                utterance.onstart = () => { showToast('🔊 Playing...');
                    isPaused = false; };
                utterance.onerror = (e) => {
                    showToast('⚠️ TTS error: ' + (e.error || 'unknown'));
                    isPaused = false;
                };
                utterance.onend = () => { showToast('✅ TTS finished');
                    isPaused = false; };
                utterance.onpause = () => { isPaused = true;
                    showToast('⏸️ Paused'); };
                utterance.onresume = () => { isPaused = false;
                    showToast('▶️ Resumed'); };
                window.speechSynthesis.speak(utterance);
            } else showToast('⚠️ TTS not supported');
        }

        document.getElementById('playTTS').onclick = speak;
        document.getElementById('pauseTTS').onclick = () => {
            if (window.speechSynthesis && window.speechSynthesis.speaking) {
                if (isPaused) { window.speechSynthesis.resume();
                    isPaused = false;
                    showToast('▶️ Resumed'); } else { window.speechSynthesis.pause();
                    isPaused = true;
                    showToast('⏸️ Paused'); }
            } else { showToast('⚠️ No audio playing'); }
        };
        document.getElementById('stopTTS').onclick = () => {
            if (window.speechSynthesis) { window
                        .speechSynthesis.cancel();
                isPaused = false;
                showToast('⏹️ Stopped'); }
        };
    }

    // ─── CERTIFICATE GENERATION ──────────────────────────────────
    async function generateCertificate(subj) {
        const div = document.createElement('div');
        div.style.cssText = 'position:fixed;left:-9999px;top:0;width:720px;';
        div.innerHTML = `
                    <div id="certCap" style="background:#fffdf7;border:6px double #c9a84c;padding:30px 24px;text-align:center;font-family:'Playfair Display',serif;border-radius:12px;">
                        <div style="font-size:1.8rem;">🏅</div>
                        <h2 style="font-size:1rem;">Certificate of Completion</h2>
                        <p style="font-size:0.8rem;">This certifies that</p>
                        <p style="font-size:1.1rem;color:#5b4af5;font-weight:700;">${currentUser?.username || 'Student'}</p>
                        <p style="font-size:0.8rem;">has completed</p>
                        <p style="font-size:1rem;font-weight:700;">${t(subj.names)}</p>
                        <p style="color:#777;margin-top:10px;font-size:0.75rem;">Date: ${new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'})}</p>
                    </div>`;
        document.body.appendChild(div);
        await new Promise(r => setTimeout(r, 300));
        try {
            const canvas = await html2canvas(document.getElementById('certCap'), { scale: 2,
                backgroundColor: '#fffdf7' });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'pt', [canvas.width, canvas.height]);
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
            const pdfBlob = pdf.output('blob');
            const formData = new FormData();
            formData.append('file', pdfBlob, 'Certificate_' + t(subj.names).replace(/\s+/g, '_') + '.pdf');
            const uploadRes = await fetch(API_BASE + '/upload', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            if (!uploadRes.ok) throw new Error('Upload failed');
            const uploadData = await uploadRes.json();
            const a = document.createElement('a');
            a.href = uploadData.url;
            a.download = 'Certificate_' + t(subj.names).replace(/\s+/g, '_') + '.pdf';
            a.click();
            showToast('🎓 Certificate downloaded!');
            showToast('🔗 Share: ' + uploadData.url);
        } catch (e) { showToast('⚠️ Certificate error: ' + e.message); }
        document.body.removeChild(div);
    }

    // ─── SELECT VOICE ────────────────────────────────────────────
    function selectVoiceForLanguage(lang) {
        if (!window.speechSynthesis) return;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) {
            window.speechSynthesis.onvoiceschanged = () => {
                selectVoiceForLanguage(lang);
            };
            return;
        }
        const langMap = {
            'bn': ['bn', 'bengali', 'bn-BD', 'bn-IN'],
            'hi': ['hi', 'hindi', 'hi-IN'],
            'en': ['en-US', 'en-GB', 'en']
        };
        const preferred = langMap[lang] || langMap['en'];
        let bestVoice = null;
        let bestScore = -1;
        for (const v of voices) {
            const name = v.name.toLowerCase();
            const voiceLang = v.lang.toLowerCase();
            let score = 0;
            for (const p of preferred) {
                if (voiceLang.includes(p) || name.includes(p)) {
                    score += 3;
                    break;
                }
            }
            if (name.includes('female') || name.includes('samantha') || name.includes('victoria') ||
                name.includes('zira') || name.includes('heather') || name.includes('sarah') ||
                name.includes('karen') || name.includes('emma') || name.includes('allison') ||
                name.includes('google') || name.includes('windows') || name.includes('natural')) {
                score += 2;
            }
            if (score > bestScore) {
                bestScore = score;
                bestVoice = v;
            }
        }
        if (bestVoice) {
            selectedVoice = bestVoice;
        } else if (voices.length > 0) {
            selectedVoice = voices[0];
        }
        if (ttsUtterance && window.speechSynthesis) {
            try {
                window.speechSynthesis.cancel();
                ttsUtterance = null;
            } catch (e) {}
        }
    }

                qlBn = new Quill(document.getElementById('qlBn'), { theme: 'snow', modules: { toolbar: tb } });
                if (ex?.contents?.en) qlEn.root.innerHTML = ex.contents.en;
                if (ex?.contents?.hi) qlHi.root.innerHTML = ex.contents.hi;
                if (ex?.contents?.bn) qlBn.root.innerHTML = ex.contents.bn;
            };
            document.head.appendChild(script);
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdn.quilljs.com/1.3.6/quill.snow.css';
            document.head.appendChild(link);
        }

        document.getElementById('saveLes').onclick = async () => {
            const titles = { en: document.getElementById('lEn').value.trim(), hi: document
                    .getElementById('lHi').value.trim(), bn: document.getElementById('lBn')
                    .value.trim() };
            if (!titles.en) return alert('⚠️ English title required');
            let contents;
            if (qlEn && qlHi && qlBn && typeof Quill !== 'undefined') {
                contents = { en: qlEn.root.innerHTML, hi: qlHi.root.innerHTML, bn: qlBn.root
                        .innerHTML };
            } else {
                const enEl = document.getElementById('qlEn');
                const hiEl = document.getElementById('qlHi');
                const bnEl = document.getElementById('qlBn');
                contents = {
                    en: enEl ? enEl.value || enEl.innerHTML || '' : '',
                    hi: hiEl ? hiEl.value || hiEl.innerHTML || '' : '',
                    bn: bnEl ? bnEl.value || bnEl.innerHTML || '' : ''
                };
            }
            const payload = { titles, contents, duration: parseInt(document.getElementById('lDur')
                    .value) || 15, level: document.getElementById('lLvl').value,
                quizPassScore: parseInt(document.getElementById('lPass').value) || 80 };
            try {
                if (ex) {
                    await apiFetch('/lessons/' + id, { method: 'PUT', body: JSON.stringify(payload) });
                    Object.assign(ex, payload);
                } else {
                    const res = await apiFetch('/lessons', { method: 'POST', body: JSON.stringify({ ...payload,
                            subjectId: selectedSubjectId }) });
                    if (!subj.lessons) subj.lessons = [];
                    subj.lessons.push(res);
                }
                modal.remove();
                showAdminLessonManager();
                showToast(ex ? '✅ Lesson updated!' : '✅ Lesson created!');
            } catch (e) { showToast('⚠️ ' + e.message); }
        };
        setTimeout(() => {
            if (typeof Quill === 'undefined') {
                ['qlEn', 'qlHi', 'qlBn'].forEach(id2 => {
                    const el = document.getElementById(id2);
                    if (el) {
                        const ta = document.createElement('textarea');
                        ta.style.cssText =
                            'width:100%;height:70px;padding:4px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg-secondary);color:var(--text);font-size:0.65rem;';
                        ta.value = el.innerHTML;
                        el.parentNode.replaceChild(ta, el);
                        ta.id = id2;
                    }
                });
            }
        }, 2000);
    }

    function openQuizManager(lessonId) {
        if (currentModal) {
            currentModal.remove();
            currentModal = null;
        }

        const subj = subjects.find(s => s.id === selectedSubjectId);
        const les = subj?.lessons?.find(l => l.id === lessonId);
        if (!les) return;
        if (!les.quiz) les.quiz = [];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
                    <div class="modal-content">
                        <h3 style="font-size:0.85rem;">📝 Quiz Manager — ${t(les.titles)} <span style="font-size:0.6rem;color:var(--text-muted);">(Pass: ${les.quizPassScore || 80}%)</span></h3>
                        <div id="quizList" style="max-height:180px;overflow-y:auto;margin-bottom:6px;">
                            ${les.quiz.length === 0 ? '<p style="color:var(--text-muted);text-align:center;font-size:0.65rem;">No questions yet.</p>' :
                            les.quiz.map((q,i) => `
                                <div style="display:flex;justify-content:space-between;align-items:center;padding:3px 5px;background:var(--glass-bg);border-radius:6px;margin-bottom:2px;gap:4px;backdrop-filter:blur(4px);">
                                    <span style="font-weight:500;font-size:0.65rem;flex:1;">Q${i+1}: ${(q.question?.en || '').substring(0,30)}... (${q.points || 5}pts)</span>
                                    <div style="display:flex;gap:2px;">
                                        <button class="btn-quiz-edit btn-sm" onclick="openQuizQEdit('${lessonId}',${i})" style="font-size:0.45rem;padding:3px 10px;"><i class="fas fa-edit"></i> Edit</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteQuizQ('${lessonId}',${i})" style="font-size:0.45rem;">🗑</button>
                                    </div>
                                </div>`).join('')}
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="openQuizQEdit('${lessonId}',null)" style="font-size:0.55rem;"><i class="fas fa-plus"></i> Add Question</button>
                        <div class="modal-actions"><button class="btn btn-outline" onclick="this.closest('.modal').remove();showAdminLessonManager();" style="font-size:0.6rem;">Close</button></div>
                    </div>`;
        document.body.appendChild(modal);
        currentModal = modal;
        modal.addEventListener('click', e => {
            if (e.target === modal) {
                modal.remove();
                currentModal = null;
                showAdminLessonManager();
            }
        });
    }

    function deleteQuizQ(lessonId, idx) {
        if (!confirm('Delete this question?')) return;
        apiFetch('/quiz/' + lessonId + '/' + idx, { method: 'DELETE' })
            .then(() => {
                const subj = subjects.find(s => s.id === selectedSubjectId);
                const les = subj?.lessons?.find(l => l.id === lessonId);
                if (les) les.quiz.splice(idx, 1);
                document.querySelector('.modal')?.remove();
                openQuizManager(lessonId);
                showToast('🗑 Question deleted');
            })
            .catch(e => showToast('⚠️ ' + e.message));
    }

    window.openQuizQEdit = function(lessonId, idx) {
        if (currentModal) {
            currentModal.remove();
            currentModal = null;
        }

        const subj = subjects.find(s => s.id === selectedSubjectId);
        const les = subj?.lessons?.find(l => l.id === lessonId);
        if (!les) return;
        const ex = idx !== null ? les.quiz[idx] : null;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.zIndex = '250';
        modal.innerHTML = `
                    <div class="modal-content">
                        <h3 style="font-size:0.85rem;">${ex ? '✏️ Edit' : '➕ Add'} Question</h3>
                        <label style="font-size:0.65rem;">Q EN<input id="qqEn" value="${ex?.question?.en || ''}" style="font-size:0.65rem;"></label>
                        <label style="font-size:0.65rem;">Q HI<input id="qqHi" value="${ex?.question?.hi || ''}" style="font-size:0.65rem;"></label>
                        <label style="font-size:0.65rem;">Q BN<input id="qqBn" value="${ex?.question?.bn || ''}" style="font-size:0.65rem;"></label>
                        ${['a','b','c','d'].map(o => `
                            <label style="font-size:0.65rem;">Opt ${o.toUpperCase()} EN<input id="o${o}En" value="${ex?.options?.find(opt=>opt.id===o)?.text?.en || ''}" style="font-size:0.65rem;"></label>
                            <label style="font-size:0.65rem;">Opt ${o.toUpperCase()} HI<input id="o${o}Hi" value="${ex?.options?.find(opt=>opt.id===o)?.text?.hi || ''}" style="font-size:0.65rem;"></label>
                            <label style="font-size:0.65rem;">Opt ${o.toUpperCase()} BN<input id="o${o}Bn" value="${ex?.options?.find(opt=>opt.id===o)?.text?.bn || ''}" style="font-size:0.65rem;"></label>
                        `).join('')}
                        <label style="font-size:0.65rem;">Correct<select id="qCor" style="font-size:0.65rem;"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></label>
                        <label style="font-size:0.65rem;">Points<input type="number" id="qPts" value="${ex?.points || 5}" style="font-size:0.65rem;"></label>
                        <div class="modal-actions">
                            <button class="btn btn-outline" onclick="this.closest('.modal').remove()" style="font-size:0.6rem;">Cancel</button>
                            <button class="btn btn-primary" id="saveQ" style="font-size:0.6rem;">💾 Save</button>
                        </div>
                    </div>`;
        document.body.appendChild(modal);
        currentModal = modal;
        if (ex) document.getElementById('qCor').value = ex.correct || 'a';
        modal.addEventListener('click', e => {
            if (e.target === modal) {
                modal.remove();
                currentModal = null;
            }
        });

        document.getElementById('saveQ').onclick = async () => {
            const options = ['a', 'b', 'c', 'd'].map(o => ({
                id: o,
                text: {
                    en: document.getElementById('o' + o + 'En').value.trim() || 'Option ' + o,
                    hi: document.getElementById('o' + o + 'Hi').value.trim() || 'Option ' + o,
                    bn: document.getElementById('o' + o + 'Bn').value.trim() || 'Option ' + o
                }
            }));
            const qData = {
                question: {
                    en: document.getElementById('qqEn').value.trim() || 'Question text',
                    hi: document.getElementById('qqHi').value.trim() || 'प्रश्न पाठ',
                    bn: document.getElementById('qqBn').value.trim() || 'প্রশ্ন পাঠ্য'
                },
                options: options,
                correct: document.getElementById('qCor').value,
                points: parseInt(document.getElementById('qPts').value) || 5,
                explanation: {}
            };
            try {
                if (ex) {
                    await apiFetch('/quiz/' + lessonId + '/' + idx, {
                        method: 'PUT',
                        body: JSON.stringify(qData)
                    });
                    Object.assign(ex, qData);
                } else {
                    const res = await apiFetch('/quiz/' + lessonId, {
                        method: 'POST',
                        body: JSON.stringify(qData)
                    });
                    if (!les.quiz) les.quiz = [];
                    les.quiz.push(res);
                }
                modal.remove();
                currentModal = null;
                openQuizManager(lessonId);
                showToast(ex ? '✅ Question updated!' : '✅ Question added!');
            } catch (e) {
                showToast('⚠️ ' + e.message);
                console.error('Quiz save error:', e);
            }
        };
    };

    async function exportData() {
        try {
            const data = await apiFetch('/export');
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'training_backup_' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            showToast('📤 Data exported!');
        } catch (e) { showToast('⚠️ ' + e.message); }
    }

    async function importData(file) {
        const reader = new FileReader();
        reader.onload = async e => {
            try {
                const data = JSON.parse(e.target.result);
                await apiFetch('/import', { method: 'POST', body: JSON.stringify(data) });
                const res = await apiFetch('/subjects');
                subjects = res || [];
                renderAdminSubjectList();
                showAdminLessonManager();
                showToast('📥 Data imported!');
            } catch (err) { alert('❌ Invalid file format.'); }
        };
        reader.readAsText(file);
    }

    // ─── AUTH PAGE ──────────────────────────────────────────────
    function renderAuthPage() {
        const mode = new URLSearchParams(window.location.search).get('auth') || 'login';
        document.getElementById('app').innerHTML = `
                    <div class="auth-container">
                        <div class="auth-box">
                            <div class="auth-icon">${mode === 'login' ? '🔐' : '📝'}</div>
                            <h2>${mode === 'login' ? 'Welcome Back' : 'Create Account'}</h2>
                            <p class="subtitle">${mode === 'login' ? 'Sign in to continue learning' : 'Join the Alamquant community'}</p>
                            ${mode === 'login' ? `
                                <input type="text" id="authUsername" placeholder="Username" value="admin">
                                <input type="password" id="authPassword" placeholder="Password" value="admin123">
                                <button class="btn btn-primary" id="authBtn" style="font-size:0.7rem;">🔓 Sign In</button>
                                <div class="auth-switch">Don't have an account? <a id="authSwitchLink">Register</a></div>
                            ` : `
                                <input type="text" id="authUsername" placeholder="Username">
                                <input type="password" id="authPassword" placeholder="Password (min 6 chars)">
                                <input type="password" id="authConfirm" placeholder="Confirm Password">
                                <button class="btn btn-primary" id="authBtn" style="font-size:0.7rem;">📝 Register</button>
                                <div class="auth-switch">Already have an account? <a id="authSwitchLink">Login</a></div>
                            `}
                            <button class="btn btn-outline btn-sm" id="authThemeTog" style="width:100%;margin-top:6px;justify-content:center;font-size:0.6rem;">${appTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode'}</button>
                        </div>
                    </div>`;
        document.getElementById('authThemeTog').onclick = () => {
            appTheme = appTheme === 'dark' ? 'light' : 'dark';
            applyTheme();
            renderAuthPage();
        };
        document.getElementById('authSwitchLink').onclick = () => {
            const newMode = mode === 'login' ? 'register' : 'login';
            window.history.replaceState({}, '', '?auth=' + newMode);
            renderAuthPage();
        };
        document.getElementById('authBtn').onclick = async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!username || !password) return showToast('⚠️ Please fill all fields');
            if (mode === 'register') {
                const confirm = document.getElementById('authConfirm').value.trim();
                if (password !== confirm) return showToast('⚠️ Passwords do not match');
                if (password.length < 6) return showToast('⚠️ Password must be at least 6 characters');
                try {
                    const res = await apiFetch('/auth/register', { method: 'POST', body: JSON
                            .stringify({ username, password }) });
                    token = res.token;
                    currentUser = res.user;
                    localStorage.setItem(TOKEN_KEY, token);
                    localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
                    if (!userAccountNo || userAccountNo === 'ACC-000000') {
                        if (currentUser && currentUser.id) {
                            const seed = currentUser.id * 73856093;
                            const num = (seed % 900000) + 100000;
                            userAccountNo = 'ACC-' + num;
                        } else {
                            userAccountNo = 'ACC-' + String(Math.floor(Math.random() * 900000) + 100000);
                        }
                        saveAccountNo();
                    }
                    showToast('🎉 Registration successful!');
                    window.history.replaceState({}, '', '?');
                    renderApp();
                    loadAllDataBackground();
                } catch (e) { showToast('❌ ' + e.message); }
            } else {
                try {
                    const res = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({
                                username, password }) });
                    token = res.token;
                    currentUser = res.user;
                    localStorage.setItem(TOKEN_KEY, token);
                    localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
                    if (!userAccountNo || userAccountNo === 'ACC-000000') {
                        if (currentUser && currentUser.id) {
                            const seed = currentUser.id * 73856093;
                            const num = (seed % 900000) + 100000;
                            userAccountNo = 'ACC-' + num;
                        } else {
                            userAccountNo = 'ACC-' + String(Math.floor(Math.random() * 900000) + 100000);
                        }
                        saveAccountNo();
                    }
                    showToast('✅ Welcome back, ' + username + '!');
                    window.history.replaceState({}, '', '?');
                    renderApp();
                    loadAllDataBackground();
                } catch (e) { showToast('❌ ' + e.message); }
            }
        };
    }

    // ─── LOAD DATA (background) ──────────────────────────────────
    async function loadAllDataBackground() {
        try {
            loadPortfolioFromStorage();
            loadPendingOrders();
            if (!userAccountNo || userAccountNo === 'ACC-000000') {
                if (currentUser && currentUser.id) {
                    const seed = currentUser.id * 73856093;
                    const num = (seed % 900000) + 100000;
                    userAccountNo = 'ACC-' + num;
                } else {
                    userAccountNo = 'ACC-' + String(Math.floor(Math.random() * 900000) + 100000);
                }
                saveAccountNo();
            }
            const [subjRes, progRes, bmRes, quizRes, notesRes, portRes] = await Promise.all([
                apiFetch('/subjects').catch(() => []),
                apiFetch('/progress').catch(() => ({})),
                apiFetch('/bookmarks').catch(() => ({})),
                apiFetch('/quiz/scores').catch(() => ({})),
                apiFetch('/notes/all').catch(() => ({})),
                apiFetch('/portfolio').catch(() => ({})),
            ]);
            subjects = subjRes || [];
            userProgress = progRes || {};
            bookmarks = new Set(bmRes || []);
            quizScores = quizRes || {};
            userNotes = notesRes || {};
            if (portRes && portRes.cash !== undefined) {
                portfolio.cash = parseFloat(portRes.cash) || 100000;
                portfolio.positions = portRes.positions || portRes.holdings || [];
                portfolio.transactions = portRes.transactions || [];
                portfolio.drawnLines = portRes.drawnLines || portRes.drawn_lines || {};
            }
            if (!portfolio.drawnLines) portfolio.drawnLines = {};
            if (!portfolio.drawnLines[simCurrentSymbol]) portfolio.drawnLines[simCurrentSymbol] = [];
            portfolio.positions.forEach(p => {
                if (!p.id) p.id = 'pos_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            });
            const cutoff = Date.now() - 86400000;
            portfolio.transactions = portfolio.transactions.filter(t => {
                if (t.time && typeof t.time === 'string') {
                    const ts = new Date(t.time).getTime();
                    if (!isNaN(ts)) return ts > cutoff;
                }
                return true;
            });
            savePortfolioToStorage();
            if (currentUser?.username === 'admin') isAdmin = true;
            if (subjects.length > 0 && !selectedSubjectId) selectedSubjectId = subjects[0].id;
            if (document.getElementById('subjectList')) {
                renderSubjectList();
                if (currentLessonId) showLessonDetail(currentLessonId);
                else showLessonList();
            } else if (document.querySelector('.terminal-wrapper, .mobile-terminal')) {
                updateSimUI();
            }
            applyTheme();
            connectBinanceWS();
            connectServerWS();
            selectVoiceForLanguage(currentLang);
            hideLoading();
        } catch (e) {
            if (e.message?.includes('Session expired')) logout();
            hideLoading();
        }
    }

    // ─── RENDER APP (dispatcher) ──────────────────────────────────
    function renderApp() {
        const mode = new URLSearchParams(window.location.search).get('mode');
        if (!token || !currentUser) { renderAuthPage(); return; }
        if (mode === 'admin') {
            if (isAdmin) renderAdminPanel();
            else { showToast('⛔ Admin access required');
                renderUserInterface(); }
            return;
        }
        if (mode === 'trading') { renderTradingTerminal(); return; }
        renderUserInterface();
    }

            if (e.message?.includes('Session expired')) logout();

            hideLoading();
        }
    }

    // ─── HIDE LOADING ──────────────────────────────────────────
    function hideLoading() {
        const el = document.getElementById('app-loading');
        if (el) el.classList.add('hidden');
    }

    // ─── STARTUP ────────────────────────────────────────────────
    applyTheme();
    if (!userAccountNo || userAccountNo === 'ACC-000000') {
        if (currentUser && currentUser.id) {
            const seed = currentUser.id * 73856093;
            const num = (seed % 900000) + 100000;
            userAccountNo = 'ACC-' + num;
        } else {
            userAccountNo = 'ACC-' + String(Math.floor(Math.random() * 900000) + 100000);
        }
        saveAccountNo();
    }
    openDB().then(() => {
        if (token && currentUser) loadAllData();
        else { renderAuthPage();
            hideLoading(); }
    }).catch(err => {
        if (token && currentUser) loadAllData();
        else { renderAuthPage();
            hideLoading(); }
    });

    // ─── GLOBAL EXPOSURE ──────────────────────────────────────
    window.renderApp = renderApp;
    window.logout = logout;
    window.showToast = showToast;
    window.customConfirm = customConfirm;
    window.placeSimOrder = placeSimOrder;
    window.exitPositionById = exitPositionById;

    window.calcLessonProgress = calcLessonProgress;
    window.generateCertificate = generateCertificate;
    window.exportData = exportData;
    window.importData = importData;
    window.showAdminLessonManager = showAdminLessonManager;
    window.selectAdminSubject = selectAdminSubject;
    window.moveSubject = moveSubject;
    window.deleteSubject = deleteSubject;

    window.moveLesson = moveLesson;

    window.deleteQuizQ = deleteQuizQ;

    console.log('🚀 ATTS Enterprise MT5 Terminal (Part 2) loaded successfully');
})();
