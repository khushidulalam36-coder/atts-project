<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📊 ATTS - Alamquant Trading Terminal (MT5)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        /* ---------- ROOT VARIABLES (MT5 Dark/Light) ---------- */
        :root {
            --bg: #0b111a;
            --bg-secondary: #111a28;
            --surface: #162033;
            --surface-alt: #0f1826;
            --surface-hover: #1e2d42;
            --border: #1e2d42;
            --border-light: #162233;
            --border-strong: #2a3f5a;
            --text: #e8edf5;
            --text-secondary: #8899b8;
            --text-muted: #4a5a78;
            --primary: #7c8cf8;
            --primary-light: #1a1f3a;
            --primary-glow: rgba(124, 140, 248, 0.3);
            --primary-gradient: linear-gradient(135deg, #5b6cf0 0%, #7c8cf8 40%, #9bb0fc 100%);
            --success: #34d399;
            --success-light: #0a2e1f;
            --danger: #f87171;
            --danger-light: #2a1215;
            --accent: #f59e0b;
            --radius: 6px;
            --radius-lg: 10px;
            --radius-full: 9999px;
            --font: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
            --mt5-bg: #0b111a;
            --mt5-surface: #111a28;
            --mt5-card: #162033;
            --mt5-input: #1a2638;
            --mt5-border: #1e2d42;
            --mt5-text: #7a8aa8;
            --mt5-text-bright: #e0e8f5;
            --mt5-green: #00c897;
            --mt5-red: #ff3b5c;
            --mt5-blue: #3b82f6;
            --mt5-gold: #f59e0b;
            --mt5-nav-bg: #0b111a;
            --mt5-nav-active: #162033;
            --mt5-chart-bg: #0a0f1a;
            --trade-buy: #00c897;
            --trade-sell: #ff3b5c;
            --glass-bg: rgba(11, 17, 26, 0.7);
            --glass-border: rgba(255,255,255,0.06);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);
            --mt5-gradient-bg: linear-gradient(180deg, #0b111a 0%, #111a28 100%);
            --transition: 0.2s ease;
            --transition-bounce: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            --sidebar-width: 220px;
            --panel-right-width: 280px;
            --bottom-panel-height: 200px;
            --header-height: 44px;
        }

        [data-theme="light"] {
            --bg: #eef0f5;
            --bg-secondary: #dce0e8;
            --surface: #ffffff;
            --surface-alt: #f5f7fc;
            --surface-hover: #eef1f8;
            --border: #c8cdd8;
            --border-light: #e5e7eb;
            --border-strong: #9ca3b0;
            --text: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --primary-glow: rgba(79, 70, 229, 0.18);
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a78bfa 100%);
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
            --mt5-bg: #eef0f5;
            --mt5-surface: #ffffff;
            --mt5-card: #f8f9fc;
            --mt5-input: #edf0f5;
            --mt5-border: #c8cdd8;
            --mt5-text: #4b5563;
            --mt5-text-bright: #111827;
            --mt5-green: #10b981;
            --mt5-red: #ef4444;
            --mt5-blue: #3b82f6;
            --mt5-gold: #f59e0b;
            --mt5-nav-bg: #eef0f5;
            --mt5-nav-active: #dce0e8;
            --mt5-chart-bg: #ffffff;
            --glass-bg: rgba(255,255,255,0.65);
            --glass-border: rgba(0,0,0,0.06);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --mt5-gradient-bg: linear-gradient(180deg, #eef0f5 0%, #dce0e8 100%);
        }

        /* ---------- RESET & SCROLLBARS ---------- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            color: var(--text);
            transition: background var(--transition), color var(--transition);
        }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ---------- LOADING OVERLAY ---------- */
        #app-loading {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #app-loading.hidden { opacity:0; pointer-events:none; }
        #app-loading .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #app-loading .loader-text { margin-top:16px; font-size:0.8rem; color:var(--text); opacity:0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- MAIN LAYOUT (MT5 STYLE) ---------- */
        .mt5-app {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--mt5-bg);
            position: relative;
            overflow: hidden;
        }

        /* ---------- LEFT PANEL: MARKET WATCH ---------- */
        .mt5-left-panel {
            width: var(--sidebar-width);
            background: var(--mt5-surface);
            border-right: 1px solid var(--mt5-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.2s ease;
        }
        .mt5-left-panel .panel-header {
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--mt5-text);
            border-bottom: 1px solid var(--mt5-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 32px;
            background: var(--mt5-nav-bg);
        }
        .mt5-left-panel .panel-header .title {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .mt5-left-panel .panel-header .actions i {
            cursor: pointer;
            margin-left: 6px;
            font-size: 0.7rem;
            color: var(--mt5-text);
        }
        .mt5-market-watch {
            flex: 1;
            overflow-y: auto;
            padding: 2px 0;
        }
        .mt5-market-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--mt5-border-light);
            transition: background 0.15s;
            font-size: 0.65rem;
        }
        .mt5-market-item:hover { background: var(--mt5-nav-active); }
        .mt5-market-item .symbol { font-weight: 600; color: var(--mt5-text-bright); }
        .mt5-market-item .price { font-family: var(--font-mono); color: var(--mt5-text-bright); }
        .mt5-market-item .change { font-size: 0.55rem; font-weight: 600; }
        .mt5-market-item .change.up { color: var(--mt5-green); }
        .mt5-market-item .change.down { color: var(--mt5-red); }
        .mt5-market-item .bid-ask {
            font-size: 0.5rem;
            color: var(--mt5-text);
            display: flex;
            gap: 4px;
        }
        .mt5-market-item .bid-ask .bid { color: var(--mt5-red); }
        .mt5-market-item .bid-ask .ask { color: var(--mt5-green); }

        /* ---------- CENTER: CHART AREA ---------- */
        .mt5-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--mt5-chart-bg);
        }

        /* Top toolbar */
        .mt5-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            background: var(--mt5-surface);
            border-bottom: 1px solid var(--mt5-border);
            min-height: var(--header-height);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .mt5-toolbar .tf-group {
            display: flex;
            gap: 2px;
        }
        .mt5-toolbar .tf-btn {
            background: transparent;
            border: 1px solid var(--mt5-border);
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 0.5rem;
            font-weight: 600;
            color: var(--mt5-text);
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            min-height: 26px;
        }
        .mt5-toolbar .tf-btn:hover { border-color: var(--mt5-green); color: var(--mt5-green); }
        .mt5-toolbar .tf-btn.active { background: var(--mt5-green); color: #fff; border-color: var(--mt5-green); }

        .mt5-toolbar .separator {
            width: 1px;
            height: 22px;
            background: var(--mt5-border);
            margin: 0 4px;
        }
        .mt5-toolbar .indicator-btn {
            background: transparent;
            border: 1px solid var(--mt5-border);
            border-radius: 3px;
            padding: 2px 8px;
            font-size: 0.5rem;
            color: var(--mt5-text);
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            min-height: 26px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .mt5-toolbar .indicator-btn.active { border-color: var(--mt5-green); color: var(--mt5-green); background: rgba(0,200,151,0.08); }

        .mt5-toolbar .draw-tools {
            display: flex;
            gap: 2px;
        }
        .mt5-toolbar .draw-tools button {
            background: transparent;
            border: 1px solid var(--mt5-border);
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 0.5rem;
            color: var(--mt5-text);
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            min-height: 26px;
        }
        .mt5-toolbar .draw-tools button:hover { border-color: var(--mt5-gold); color: var(--mt5-gold); }
        .mt5-toolbar .draw-tools button.active { border-color: var(--mt5-gold); color: var(--mt5-gold); background: rgba(245,158,11,0.08); }

        .mt5-toolbar .account-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.55rem;
            color: var(--mt5-text);
        }
        .mt5-toolbar .account-info .balance { color: var(--mt5-green); font-weight: 700; }
        .mt5-toolbar .account-info .equity { color: var(--mt5-text-bright); }
        .mt5-toolbar .account-info .pl { font-weight: 600; }
        .mt5-toolbar .account-info .pl.green { color: var(--mt5-green); }
        .mt5-toolbar .account-info .pl.red { color: var(--mt5-red); }
        .mt5-toolbar .account-info .acct-no {
            font-family: var(--font-mono);
            font-size: 0.45rem;
            color: var(--mt5-text);
            background: var(--mt5-input);
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* Chart container */
        .mt5-chart-wrap {
            flex: 1;
            position: relative;
            min-height: 0;
            background: var(--mt5-chart-bg);
            overflow: hidden;
        }
        .mt5-chart-wrap #simChartContainer {
            width: 100%;
            height: 100%;
            min-height: 120px;
            background: var(--mt5-chart-bg);
            cursor: crosshair;
        }
        .mt5-chart-wrap #simChartContainer.dragging-line { cursor: row-resize; }

        .chart-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--mt5-text);
            font-size: 0.65rem;
            font-weight: 500;
        }

        /* ---------- RIGHT PANEL: ORDER PANEL ---------- */
        .mt5-right-panel {
            width: var(--panel-right-width);
            background: var(--mt5-surface);
            border-left: 1px solid var(--mt5-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.2s ease;
        }
        .mt5-right-panel .panel-header {
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--mt5-text);
            border-bottom: 1px solid var(--mt5-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 32px;
            background: var(--mt5-nav-bg);
        }
        .mt5-order-panel {
            padding: 8px 10px;
            flex: 1;
            overflow-y: auto;
        }
        .mt5-order-panel .symbol-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }
        .mt5-order-panel .symbol-row select {
            flex: 1;
            background: var(--mt5-input);
            border: 1px solid var(--mt5-border);
            color: var(--mt5-text-bright);
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 600;
            font-family: var(--font);
            min-height: 30px;
        }
        .mt5-order-panel .order-type-row {
            display: flex;
            gap: 2px;
            margin-bottom: 6px;
        }
        .mt5-order-panel .order-type-row button {
            flex: 1;
            background: var(--mt5-input);
            border: 1px solid var(--mt5-border);
            color: var(--mt5-text);
            padding: 3px 0;
            border-radius: 3px;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            min-height: 28px;
        }
        .mt5-order-panel .order-type-row button.active {
            background: var(--mt5-green);
            color: #fff;
            border-color: var(--mt5-green);
        }
        .mt5-order-panel .order-type-row button.sell.active { background: var(--mt5-red); border-color: var(--mt5-red); }

        .mt5-order-panel .input-group {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .mt5-order-panel .input-group label {
            font-size: 0.5rem;
            font-weight: 600;
            color: var(--mt5-text);
            min-width: 30px;
        }
        .mt5-order-panel .input-group input,
        .mt5-order-panel .input-group select {
            flex: 1;
            background: var(--mt5-input);
            border: 1px solid var(--mt5-border);
            color: var(--mt5-text-bright);
            padding: 3px 5px;
            border-radius: 3px;
            font-size: 0.5rem;
            font-family: var(--font);
            min-height: 28px;
        }
        .mt5-order-panel .input-group input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .mt5-order-panel .input-group input[type="number"]::-webkit-inner-spin-button,
        .mt5-order-panel .input-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin:0;
        }

        .mt5-order-panel .action-buttons {
            display: flex;
            gap: 4px;
            margin: 8px 0 4px;
        }
        .mt5-order-panel .action-buttons button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.65rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            min-height: 36px;
        }
        .mt5-order-panel .action-buttons .buy-btn { background: var(--mt5-green); }
        .mt5-order-panel .action-buttons .sell-btn { background: var(--mt5-red); }
        .mt5-order-panel .action-buttons button:hover { filter: brightness(1.1); }

        .mt5-order-panel .price-display {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--mt5-text-bright);
            margin: 4px 0;
            font-family: var(--font-mono);
        }
        .mt5-order-panel .price-display .bid { color: var(--mt5-red); }
        .mt5-order-panel .price-display .ask { color: var(--mt5-green); }

        .mt5-order-panel .quick-lot {
            display: flex;
            gap: 2px;
            margin: 4px 0;
        }
        .mt5-order-panel .quick-lot button {
            flex: 1;
            background: var(--mt5-input);
            border: 1px solid var(--mt5-border);
            color: var(--mt5-text);
            padding: 2px 0;
            border-radius: 3px;
            font-size: 0.45rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            min-height: 24px;
        }
        .mt5-order-panel .quick-lot button:hover { background: var(--mt5-green); color: #fff; }

        /* ---------- BOTTOM PANEL: POSITIONS / HISTORY ---------- */
        .mt5-bottom-panel {
            height: var(--bottom-panel-height);
            background: var(--mt5-surface);
            border-top: 1px solid var(--mt5-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .mt5-bottom-panel .bottom-tabs {
            display: flex;
            background: var(--mt5-nav-bg);
            border-bottom: 1px solid var(--mt5-border);
            min-height: 28px;
            flex-shrink: 0;
        }
        .mt5-bottom-panel .bottom-tabs button {
            background: transparent;
            border: none;
            padding: 4px 14px;
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--mt5-text);
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font);
            border-bottom: 2px solid transparent;
            min-height: 28px;
        }
        .mt5-bottom-panel .bottom-tabs button.active {
            color: var(--mt5-green);
            border-bottom-color: var(--mt5-green);
        }
        .mt5-bottom-panel .bottom-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 6px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 160px;
                --panel-right-width: 220px;
                --bottom-panel-height: 160px;
            }
            .mt5-right-panel .order-type-row button { font-size: 0.4rem; padding: 2px 0; }
            .mt5-toolbar .account-info .balance-label { display: none; }
        }
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 0;
                --panel-right-width: 0;
                --bottom-panel-height: 120px;
            }
            .mt5-left-panel { width: 0; border-right: none; }
            .mt5-right-panel { width: 0; border-left: none; }
            .mt5-center { width: 100%; }
            .mt5-toolbar .account-info .equity-label { display: none; }
            .mt5-toolbar .account-info .pl-label { display: none; }
            .mt5-order-panel .action-buttons button { font-size: 0.55rem; }
            /* Mobile overlays will be shown via JS */
            .mt5-mobile-menu-btn {
                display: block !important;
            }
        }

        /* ---------- UTILITY ---------- */
        .hidden { display: none !important; }
        .mt5-mobile-menu-btn { display: none; }

        /* ---------- CUSTOM MODAL / TOAST ---------- */
        /* Keep existing modal and toast styles from original */
        .modal {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 600;
            animation: modalFadeIn 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            padding: 20px 22px;
            max-width: 620px;
            width: 93%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--glass-shadow);
            animation: modalSlideUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
            border: 1px solid var(--glass-border);
            color: var(--text);
        }
        .modal-content h3 { font-size:0.95rem; margin-bottom:10px; font-weight:700; font-family:'Outfit',sans-serif; color:var(--text); }
        .modal-content label { display:block; margin-bottom:5px; font-weight:500; font-size:0.7rem; color:var(--text-secondary); }
        .modal-content input, .modal-content select, .modal-content textarea {
            width:100%; padding:6px 10px; border:1.5px solid var(--glass-border); border-radius:var(--radius);
            font-family:var(--font); font-size:0.7rem; transition:all var(--transition); margin-top:2px;
            background:var(--glass-bg); color:var(--text); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
        }
        .modal-content input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow); outline:none; }
        .modal-actions { display:flex; gap:6px; margin-top:12px; justify-content:flex-end; flex-wrap:wrap; }

        @keyframes modalFadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes modalSlideUp { from { opacity:0; transform:translateY(30px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }

        .toast {

                const d = e.target.result;
                if (!d.objectStoreNames.contains('candles')) {
                    d.createObjectStore('candles', { keyPath: 'id' });

                if (!d.objectStoreNames.contains('chartState')) {

                    d.createObjectStore('portfolio', { keyPath: 'id' });
                }
            };
            req.onsuccess = (e) => { db = e.target.result;
                resolve(db); };
            req.onerror = (e) => { reject(e.target.error); };
        });
    }

            oscillator.connect(gainNode);

            if (type === 'buy') { oscillator.frequency.value = 800;

            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

            const directUrl =
                `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${Math.min(limit, 1000)}`;
            const directRes = await fetch(directUrl);
            if (!directRes.ok) throw new Error('Binance direct fetch failed');

                    high: parseFloat(k[2]),
                    low: parseFloat(k[3]),

            return null;

    // ─── AGGREGATION ─────────────────────────────────────────────
    function aggregateCandles(rawCandles, tfSeconds) {
        if (!rawCandles || rawCandles.length === 0) return [];
        const buckets = {};
        for (const c of rawCandles) {
            const bucket = Math.floor(c.time / tfSeconds) * tfSeconds;
            if (!buckets[bucket]) {
                buckets[bucket] = { time: bucket, open: c.open, high: c.high, low: c.low, close: c.close,
                    volume: c.volume || 0 };
            } else {
                const b = buckets[bucket];
                b.high = Math.max(b.high, c.high);
                b.low = Math.min(b.low, c.low);
                b.close = c.close;
                b.volume = (b.volume || 0) + (c.volume || 0);
            }
        }
        const result = Object.values(buckets).sort((a, b) => a.time - b.time);
        for (let i = 0; i < result.length; i++) {
            const bucketTime = result[i].time;
            const first = rawCandles.find(c => Math.floor(c.time / tfSeconds) * tfSeconds === bucketTime);
            if (first) result[i].open = first.open;
        }
        return result;
    }

    // ─── CHART INIT (with 10x candles) ──────────────────────────
    async function initChart() {
        if (chartInitInProgress) return;
        if (window._chartCleanup) window._chartCleanup();
        const chartDiv = document.getElementById('simChartContainer');
        const loadingEl = document.getElementById('chartLoading');
        if (!chartDiv) return;

        if (chartDiv.clientWidth === 0 || chartDiv.clientHeight === 0) {
            if (!chartInitRetryTimer) {
                chartInitRetryTimer = setTimeout(initChart, 300);
            }
            return;
        }
        chartInitInProgress = true;
        if (typeof LightweightCharts === 'undefined') {
            if (loadingEl) loadingEl.innerHTML =
                '<span style="color:var(--mt5-red);">⚠️ Chart library not loaded.</span>';
            chartInitInProgress = false;
            return;
        }

        if (simChart) { try { simChart.remove(); } catch (e) {}
            simChart = null;
            simCandleSeries = null;
            simVolumeSeries = null;
            simIndicatorSeries = {}; }
        chartDiv.querySelectorAll('canvas').forEach(c => c.remove());
        if (loadingEl) loadingEl.style.display = 'flex';

        let realTimePrice = simLastPrices[simCurrentSymbol] || lastBinancePrice[simCurrentSymbol];
        if (!realTimePrice || isNaN(realTimePrice)) {
            const fetchedPrice = await fetchBinancePrice(simCurrentSymbol);
            if (fetchedPrice && fetchedPrice > 0) {
                realTimePrice = fetchedPrice;
                simLastPrices[simCurrentSymbol] = realTimePrice;
                simBasePrices[simCurrentSymbol] = realTimePrice;
            }
        }
        if (!realTimePrice || isNaN(realTimePrice)) {
            realTimePrice = simBasePrices[simCurrentSymbol] || 45000;
        }

        const binanceInterval = '1m';
        let rawCandles = await fetchBinanceCandles(simCurrentSymbol, binanceInterval, 50000); // 10x
        let candles = [];
        let sourceLabel = 'Binance REST (proxy)';

        if (rawCandles && rawCandles.length > 0) {
            const tfSeconds = currentTimeframe;
            const aggregated = aggregateCandles(rawCandles, tfSeconds);
            candles = sanitizeCandleData(aggregated);
            await saveCandlesToDB(simCurrentSymbol, currentTimeframe, candles);
        } else {
            let dbCandles = await loadCandlesFromDB(simCurrentSymbol, currentTimeframe);
            if (dbCandles && dbCandles.length > 0) {
                candles = sanitizeCandleData(dbCandles);
                sourceLabel = 'IndexedDB';
            } else {
                const simCandles = generateSeamlessSimulatedCandles(simCurrentSymbol, 2500, realTimePrice,
                    currentTimeframe);
                candles = sanitizeCandleData(simCandles);
                sourceLabel = 'Simulation (Fallback)';
                await saveCandlesToDB(simCurrentSymbol, currentTimeframe, candles);
            }
        }

        let latestCandle = await fetchBinanceLatest(simCurrentSymbol);
        if (latestCandle && latestCandle.close) {
            latestCandle = sanitizeCandle(latestCandle);
            if (latestCandle) {
                const tfSeconds = currentTimeframe;
                const bucket = Math.floor(latestCandle.time / tfSeconds) * tfSeconds;
                const exists = candles.some(c => {
                    const cb = Math.floor(c.time / tfSeconds) * tfSeconds;
                    return cb === bucket;
                });
                if (!exists) {
                    candles.push(latestCandle);
                    candles.sort((a, b) => a.time - b.time);
                } else {
                    const idx = candles.findIndex(c => {
                        const cb = Math.floor(c.time / tfSeconds) * tfSeconds;
                        return cb === bucket;
                    });
                    if (idx !== -1) {
                        candles[idx].close = latestCandle.close;
                        candles[idx].high = Math.max(candles[idx].high, latestCandle.high);
                        candles[idx].low = Math.min(candles[idx].low, latestCandle.low);
                        candles[idx].volume = (candles[idx].volume || 0) + (latestCandle.volume || 0);
                    }
                }
                if (simLastPrices[simCurrentSymbol]) {
                    simPrevClosePrices[simCurrentSymbol] = simLastPrices[simCurrentSymbol];
                }
                realTimePrice = latestCandle.close;
                simLastPrices[simCurrentSymbol] = latestCandle.close;
                simBasePrices[simCurrentSymbol] = latestCandle.close;
                sourceLabel += ' + latest';
            }
        }

        if (candles.length > 0) {
            const lastCandle = candles[candles.length - 1];
            if (isValidNumber(realTimePrice) && Math.abs(lastCandle.close - realTimePrice) > 0.0001) {
                lastCandle.close = realTimePrice;
                if (realTimePrice > lastCandle.high) lastCandle.high = realTimePrice;
                if (realTimePrice < lastCandle.low) lastCandle.low = realTimePrice;
            }
        }

        simAllCandles = sanitizeCandleData(candles);
        if (simAllCandles.length === 0) {
            const simCandles = generateSeamlessSimulatedCandles(simCurrentSymbol, 2500, realTimePrice,
                currentTimeframe);
            simAllCandles = sanitizeCandleData(simCandles);
            sourceLabel = 'Simulation (Emergency)';
        }

        const now = Math.floor(Date.now() / 1000);
        const tfSeconds = currentTimeframe;
        const currentBucket = Math.floor(now / tfSeconds) * tfSeconds;
        const lastClose = simAllCandles.length > 0 ? simAllCandles[simAllCandles.length - 1].close :
            realTimePrice;
        simCurrentCandle = sanitizeCandle({
            time: currentBucket,
            open: lastClose,
            high: lastClose,
            low: lastClose,
            close: lastClose,
            volume: 0
        });
        if (isValidNumber(realTimePrice) && realTimePrice > 0) {
            simCurrentCandle.open = lastClose;
            simCurrentCandle.close = realTimePrice;
            simCurrentCandle.high = Math.max(lastClose, realTimePrice);
            simCurrentCandle.low = Math.min(lastClose, realTimePrice);
        }

        const visible = initLazy(simAllCandles);
        const isMobile = window.innerWidth <= 768;
        const chartHeight = isMobile ? Math.max(120, chartDiv.clientHeight) : Math.max(200, chartDiv.clientHeight);
        const isDark = appTheme === 'dark';

        try {
            const barSpacing = isMobile ? 2 : 4;
            simChart = LightweightCharts.createChart(chartDiv, {
                width: chartDiv.clientWidth,
                height: chartHeight,
                timeScale: {
                    timeVisible: true,
                    secondsVisible: currentTimeframe < 300,
                    rightOffset: isMobile ? 4 : 10,
                    barSpacing: barSpacing,
                    minBarSpacing: isMobile ? 1 : 2
                },
                layout: {
                    background: { type: 'solid', color: 'transparent' },
                    textColor: isDark ? '#94a3b8' : '#6b7280'
                },
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                crosshair: { mode: 1 },
                rightPriceScale: { borderVisible: true, autoScale: true, scaleMargins: { top: 0.05,
                        bottom: 0.05 } },
                handleScroll: { vertTouchDrag: false, horzTouchDrag: true },
                handleScale: { axisPressedMouseMove: true, pinch: true },
            });

            simCandleSeries = simChart.addCandlestickSeries({
                upColor: '#00c897',
                downColor: '#ff3b5c',
                borderUpColor: '#00c897',
                borderDownColor: '#ff3b5c',
                wickUpColor: '#00c897',
                wickDownColor: '#ff3b5c'
            });
            simVolumeSeries = simChart.addHistogramSeries({ priceFormat: { type: 'volume' },
                priceScaleId: '' });
            if (showVolume) simChart.priceScale('').applyOptions({ scaleMargins: { top: 0.88, bottom: 0 } });
            else simChart.priceScale('').applyOptions({ scaleMargins: { top: 0, bottom: 0 } });

            const allCandles = [...visible];
            if (simCurrentCandle) {
                const sanitizedCurrent = sanitizeCandle(simCurrentCandle);
                if (sanitizedCurrent) allCandles.push(sanitizedCurrent);
            }
            let safeAll = sanitizeCandleData(allCandles).filter(c => c !== null);
            safeAll.sort((a, b) => a.time - b.time);
            const unique = [];
            for (let i = 0; i < safeAll.length; i++) {
                if (i === 0 || safeAll[i].time > unique[unique.length - 1].time) {
                    unique.push(safeAll[i]);
                }
            }
            safeAll = unique;
            if (safeAll.length > 0) { try { simCandleSeries.setData(safeAll); } catch (e) { simCandleSeries
                        .setData([]); } }
            updateAllIndicators();
            const volData = visible.map(c => ({ time: c.time, value: c.volume || 0, color: c.close >= c
                    .open ? 'rgba(0,200,151,0.35)' : 'rgba(255,59,92,0.35)' }));
            simVolumeSeries.setData(volData);

            simChart.timeScale().fitContent();
            const visibleRange = simChart.timeScale().getVisibleRange();
            if (visibleRange) {
                const rightEdge = visibleRange.to;
                const leftEdge = visibleRange.from;
                const rangeWidth = rightEdge - leftEdge;
                const lastTime = simAllCandles.length > 0 ? simAllCandles[simAllCandles.length - 1].time :
                    Date.now() / 1000;
                const newRight = lastTime + tfSeconds;
                const newLeft = newRight - rangeWidth;
                if (newLeft > 0) { try { simChart.timeScale().setVisibleRange({ from: newLeft, to: newRight }); } catch (
                    e) {} }
            }

            const savedInd = await loadIndicatorsFromDB();
            if (savedInd && Object.keys(savedInd).length) {
                activeIndicators = savedInd;
                updateAllIndicators();
                updateIndDropdownBtnState();
            }
            const savedDraw = await loadDrawingsFromDB(simCurrentSymbol);
            if (savedDraw && savedDraw.length) {
                if (!portfolio.drawnLines[simCurrentSymbol]) portfolio.drawnLines[simCurrentSymbol] = [];
                portfolio.drawnLines[simCurrentSymbol] = savedDraw;
                redrawAllLines();
            }
            const savedState = await loadChartStateFromDB(simCurrentSymbol);
            if (savedState && savedState.zoom) { try { simChart.timeScale().setVisibleRange(savedState.zoom); } catch (
                e) {} }

            simChart.subscribeClick(param => {
                if (!currentDrawingTool || !param.point || !simCandleSeries) return;
                if (param.point.y > 0 && param.point.y < chartDiv.clientHeight) {
                    const price = simCandleSeries.coordinateToPrice(param.point.y);
                    if (isValidNumber(price) && price > 0) {
                        let color, label;
                        if (currentDrawingTool === 'support') { color = '#00c897';
                            label = 'Support'; } else if (currentDrawingTool === 'resistance') { color =
                                '#ff3b5c';
                            label = 'Resistance'; } else { color = '#3b82f6';
                            label = 'H-Line'; }
                        if (!portfolio.drawnLines[simCurrentSymbol]) portfolio.drawnLines[
                            simCurrentSymbol] = [];
                        portfolio.drawnLines[simCurrentSymbol].push({ price: +price.toFixed(4),
                            color, label, style: 0 });
                        savePortfolioToStorage();
                        saveDrawingsToDB(simCurrentSymbol, portfolio.drawnLines[simCurrentSymbol]);
                        redrawAllLines();
                        showToast('📐 ' + label + ' at $' + price.toFixed(4));
                        currentDrawingTool = null;
                        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove(
                            'active'));
                    }
                }
            });

            let dragStateLocal = null;
            const mousedownHandler = (e) => {
                if (!simCandleSeries) return;
                const rect = chartDiv.getBoundingClientRect();
                const y = (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top;
                const threshold = 14;
                let closest = null,
                    closestDist = Infinity;
                for (const key of Object.keys(allPriceLines)) {
                    const line = allPriceLines[key];
                    if (!line) continue;
                    let price = null;
                    try {
                        if (typeof line.options === 'function') {
                            const opts = line.options();
                            price = opts.price;
                        } else {
                            price = line.options?.price;
                        }
                    } catch (ex) { continue; }
                    if (price === undefined || price === null) continue;
                    let lineY = simCandleSeries.priceToCoordinate(price);
                    if (lineY === null) {
                        const priceScale = simChart.priceScale('right');
                        if (priceScale) {
                            const coord = priceScale.priceToCoordinate(price);
                            if (coord !== null) lineY = coord;
                        }
                        if (lineY === null) continue;
                    }
                    const dist = Math.abs(y - lineY);
                    if (dist < threshold && dist < closestDist) {
                        const isSLTP = key.startsWith('sl_') || key.startsWith('tp_') || key.startsWith(
                            'entry_');
                        const posId = key.startsWith('sl_') ? key.replace('sl_', '') :
                            key.startsWith('tp_') ? key.replace('tp_', '') :
                            key.startsWith('entry_') ? key.replace('entry_', '') : null;
                        const pos = posId ? portfolio.positions.find(p => p.id === posId) : null;
                        if (isSLTP && !pos) continue;
                        closest = { key, price, posId, pos, isSLTP, line };
                        closestDist = dist;
                    }
                }
                if (closest) {
                    dragStateLocal = { active: true, lineKey: closest.key, startPrice: closest.price,
                        currentPrice: closest.price, posId: closest.posId, pos: closest.pos,
                        isSLTP: closest.isSLTP };
                    chartDiv.classList.add('dragging-line');
                    e.preventDefault();
                }
            };
            chartDiv.addEventListener('mousedown', mousedownHandler);
            chartDiv.addEventListener('touchstart', mousedownHandler, { passive: false });

            const moveHandler = (e) => {
                if (!dragStateLocal || !dragStateLocal.active || !simCandleSeries) return;
                const rect = chartDiv.getBoundingClientRect();
                const y = (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top;
                const newPrice = simCandleSeries.coordinateToPrice(y);
                if (isValidNumber(newPrice) && newPrice > 0) {
                    dragStateLocal.currentPrice = +newPrice.toFixed(4);
                    const key = dragStateLocal.lineKey;
                    if (allPriceLines[key]) {
                        try {
                            const line = allPriceLines[key];
                            line.applyOptions({ price: dragStateLocal.currentPrice });
                        } catch (ex) {}
                    }
                }
            };
            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('touchmove', moveHandler, { passive: false });

            const upHandler = () => {
                if (dragStateLocal && dragStateLocal.active) {
                    const key = dragStateLocal.lineKey;
                    const newPrice = dragStateLocal.currentPrice;
                    const posId = dragStateLocal.posId;
                    if (posId && dragStateLocal.isSLTP) {
                        const pos = portfolio.positions.find(p => p.id === posId);
                        if (pos) {
                            if (key.startsWith('sl_')) {
                                pos.slPrice = newPrice;
                                showToast('🔧 SL moved to $' + newPrice.toFixed(4));
                            } else if (key.startsWith('tp_')) {
                                pos.tpPrice = newPrice;
                                showToast('🔧 TP moved to $' + newPrice.toFixed(4));
                            }
                            savePortfolioToStorage();
                            syncPortfolioToServer();
                            redrawAllLines();
                            updateSimUI();
                        }
                    } else if (key && !key.startsWith('sl_') && !key.startsWith('tp_') && !key.startsWith(
                            'entry_')) {
                        const lines = portfolio.drawnLines[simCurrentSymbol] || [];
                        const idx = manualDrawnLines.findIndex(m => m.key === key);
                        if (idx >= 0 && idx < lines.length) {
                            lines[idx].price = newPrice;
                            savePortfolioToStorage();
                            saveDrawingsToDB(simCurrentSymbol, lines);
                            redrawAllLines();
                            showToast('📐 Line moved to $' + newPrice.toFixed(4));
                        }
                    }
                    dragStateLocal = null;
                    chartDiv.classList.remove('dragging-line');
                }
            };
            document.addEventListener('mouseup', upHandler);
            document.addEventListener('touchend', upHandler);

            simChart.timeScale().subscribeVisibleTimeRangeChange(range => {
                if (range) { saveChartStateToDB(simCurrentSymbol, { zoom: range }); }
            });

            if (loadingEl) loadingEl.style.display = 'none';
            redrawAllLines();

            if (simPriceIntervalId) clearInterval(simPriceIntervalId);
            simPriceIntervalId = setInterval(() => {
                if (wsConnected && lastBinancePrice[simCurrentSymbol]) {
                    const price = lastBinancePrice[simCurrentSymbol];
                    if (isValidNumber(price) && price > 0) {
                        if (simLastPrices[simCurrentSymbol]) {
                            simPrevClosePrices[simCurrentSymbol] = simLastPrices[simCurrentSymbol];
                        }
                        simLastPrices[simCurrentSymbol] = price;
                        updateSimUI();
                        updateMobileTopBar();
                        updateWatchlistPrices();
                    }
                    return;
                }
                if (!simCurrentCandle || !simCandleSeries) return;
                let price = simLastPrices[simCurrentSymbol];
                if (!isValidNumber(price)) {
                    const vol = simVolatility[simCurrentSymbol] || 0.0015;
                    const change = (simCurrentCandle.close || 100) * vol * (Math.random() - 0.48) *
                        0.8;
                    price = (simCurrentCandle.close || 100) + change;
                    price = +price.toFixed(4);
                    if (simLastPrices[simCurrentSymbol]) {
                        simPrevClosePrices[simCurrentSymbol] = simLastPrices[simCurrentSymbol];
                    }
                    simLastPrices[simCurrentSymbol] = price;
                }
                if (!isValidNumber(price)) {
                    price = simCurrentCandle.close || simBasePrices[simCurrentSymbol] || 100;
                }
                simCurrentCandle.high = Math.max(simCurrentCandle.high || price, price);
                simCurrentCandle.low = Math.min(simCurrentCandle.low || price, price);
                simCurrentCandle.close = price;
                simCurrentCandle.volume = (simCurrentCandle.volume || 0) + Math.floor(500 + Math
                    .random() * 3000);
                safeUpdateCandle(simCurrentCandle, 'simulation');
                updateAllIndicators();
                checkAndExecuteSLTP();
                updateSimUI();
                updateMobileTopBar();
                updateWatchlistPrices();
                checkPendingOrders();
            }, 1000);

            if (simCandleCloseIntervalId) clearInterval(simCandleCloseIntervalId);
            simCandleCloseIntervalId = setInterval(() => {
                if (!simCurrentCandle || !simCandleSeries) return;
                const now2 = Math.floor(Date.now() / 1000);
                const tf2 = currentTimeframe;
                const currentBucket2 = Math.floor(now2 / tf2) * tf2;
                if (simCurrentCandle.time < currentBucket2) {
                    const closedCandle = sanitizeCandle({ ...simCurrentCandle });
                    if (closedCandle) {
                        simAllCandles.push(closedCandle);
                        if (simAllCandles.length > 10000) simAllCandles = simAllCandles.slice(
                            -10000);
                        saveCandlesToDB(simCurrentSymbol, currentTimeframe, simAllCandles);
                    }
                    const newOpen = simCurrentCandle.close;
                    const newCandle = sanitizeCandle({
                        time: currentBucket2,
                        open: newOpen,
                        high: newOpen,
                        low: newOpen,
                        close: newOpen,
                        volume: 0
                    });
                    if (newCandle) {
                        simCurrentCandle = newCandle;
                        safeUpdateCandle(simCurrentCandle, 'candle close');
                        updateAllIndicators();
                    }
                }
            }, Math.min(tfSeconds * 1000, 30000));

            const debouncedResize = debounce(() => {
                if (simChart && chartDiv.clientWidth > 0 && chartDiv.clientHeight > 0) {
                    try { simChart.applyOptions({ width: chartDiv.clientWidth, height: chartDiv
                            .clientHeight }); } catch (e) {}
                    try {
                        const vr = simChart.timeScale().getVisibleRange();
                        if (vr && simAllCandles.length > 0) {
                            const last = simAllCandles[simAllCandles.length - 1].time;
                            const right = vr.to;
                            if (last > right - tfSeconds) {
                                const width = vr.to - vr.from;
                                simChart.timeScale().setVisibleRange({ from: vr.from, to: last +
                                    tfSeconds });
                            }
                        }
                    } catch (e) {}
                }
            }, 150);
            if (simResizeObserver) simResizeObserver.disconnect();
            simResizeObserver = new ResizeObserver(debouncedResize);
            simResizeObserver.observe(chartDiv);

            window._chartCleanup = function() {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('touchmove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
                document.removeEventListener('touchend', upHandler);
                chartDiv.removeEventListener('mousedown', mousedownHandler);
                chartDiv.removeEventListener('touchstart', mousedownHandler);
                if (simPriceIntervalId) clearInterval(simPriceIntervalId);
                if (simCandleCloseIntervalId) clearInterval(simCandleCloseIntervalId);
                if (simResizeObserver) simResizeObserver.disconnect();
                if (simChart) { try { simChart.remove(); } catch (e) {}
                    simChart = null; }
            };

            if (chartVisibilityHandler) document.removeEventListener('visibilitychange',
                chartVisibilityHandler);
            chartVisibilityHandler = () => {
                if (document.visibilityState === 'visible') {
                    if (simChart && chartDiv) {
                        setTimeout(() => {
                            if (chartDiv.clientWidth > 0 && chartDiv.clientHeight > 0) {
                                try { simChart.applyOptions({ width: chartDiv.clientWidth,
                                        height: chartDiv.clientHeight }); } catch (e) {}
                                try { simChart.timeScale().fitContent(); } catch (e) {}
                                try { const r = simChart.timeScale().getVisibleRange(); if (r)
                                        simChart.timeScale().setVisibleRange(r); } catch (e) {}
                            } else { resetChart(); }
                        }, 120);
                    } else { resetChart(); }
                }
            };
            document.addEventListener('visibilitychange', chartVisibilityHandler);

            chartInitInProgress = false;
            if (chartInitRetryTimer) { clearTimeout(chartInitRetryTimer);
                chartInitRetryTimer = null; }

        } catch (err) {
            if (loadingEl) loadingEl.innerHTML =
                '<span style="color:var(--mt5-red);">⚠️ Chart error: ' + err.message + '</span>';
            if (simChart) { try { simChart.remove(); } catch (e) {}
                simChart = null; }
            if (chartInitRetryTimer) clearTimeout(chartInitRetryTimer);
            chartInitRetryTimer = setTimeout(() => { chartInitInProgress = false;
                initChart(); }, 2000);
        }
    }

    // ─── INDICATOR CALCULATIONS ──────────────────────────────────
    function calculateEMA(data, period) {
        if (data.length < period) return [];
        const ema = [];
        const k = 2 / (period + 1);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i].close;
        let prevEma = sum / period;
        ema.push({ time: data[period - 1].time, value: +prevEma.toFixed(4) });
        for (let i = period; i < data.length; i++) {
            prevEma = data[i].close * k + prevEma * (1 - k);
            ema.push({ time: data[i].time, value: +prevEma.toFixed(4) });
        }
        return ema;
    }

    function calculateSMA(data, period) {
        if (data.length < period) return [];
        const sma = [];
        for (let i = period - 1; i < data.length; i++) {
            let sum = 0;
            for (let j = 0; j < period; j++) sum += data[i - j].close;
            sma.push({ time: data[i].time, value: +(sum / period).toFixed(4) });
        }
        return sma;
    }

    function calculateBB(data, period, stdDev) {
        period = period || 20;
        stdDev = stdDev || 2;
        const sma = calculateSMA(data, period);
        const upper = [],
            lower = [];
        for (let i = period - 1; i < data.length; i++) {
            let sum = 0;
            for (let j = 0; j < period; j++) sum += data[i - j].close;
            const mean = sum / period;
            let variance = 0;
            for (let j = 0; j < period; j++) variance += Math.pow(data[i - j].close - mean, 2);
            const std = Math.sqrt(variance / period);
            upper.push({ time: data[i].time, value: +(mean + stdDev * std).toFixed(4) });
            lower.push({ time: data[i].time, value: +(mean - stdDev * std).toFixed(4) });
        }
        return { sma, upper, lower };
    }

    function calculateRSI(data, period) {
        period = period || 14;
        if (data.length < period + 1) return [];
        const rsi = [];
        let avgGain = 0,
            avgLoss = 0;
        for (let i = 1; i <= period; i++) {
            const diff = data[i].close - data[i - 1].close;
            if (diff > 0) avgGain += diff;
            else avgLoss -= diff;
        }
        avgGain /= period;
        avgLoss /= period;
        for (let i = period; i < data.length; i++) {
            if (avgLoss === 0) rsi.push({ time: data[i].time, value: 100 });
            else { const rs = avgGain / avgLoss;
                rsi.push({ time: data[i].time, value: +(100 - 100 / (1 + rs)).toFixed(2) }); }
            const diff = data[i].close - data[i - 1].close;
            const gain = diff > 0 ? diff : 0;
            const loss = diff < 0 ? -diff : 0;
            avgGain = (avgGain * (period - 1) + gain) / period;
            avgLoss = (avgLoss * (period - 1) + loss) / period;
        }
        return rsi;
    }

    function calculateMACD(data, fast, slow, signal) {
        fast = fast || 12;
        slow = slow || 26;
        signal = signal || 9;
        const emaFast = calculateEMA(data, fast);
        const emaSlow = calculateEMA(data, slow);
        const macdLine = [];
        for (let i = 0; i < data.length; i++) {
            const f = emaFast.find(e => e.time === data[i].time);
            const s = emaSlow.find(e => e.time === data[i].time);
            if (f && s) macdLine.push({ time: data[i].time, value: +(f.value - s.value).toFixed(4) });
        }
        if (macdLine.length === 0) return { macd: [], signal: [], histogram: [] };
        const signalLine = calculateEMAFromValues(macdLine, signal);
        const histogram = [];
        for (let i = 0; i < macdLine.length; i++) {
            const sig = signalLine.find(s => s.time === macdLine[i].time);
            if (sig) histogram.push({ time: macdLine[i].time, value: +(macdLine[i].value - sig.value)
                    .toFixed(4) });
        }
        return { macd: macdLine, signal: signalLine, histogram };
    }

    function calculateEMAFromValues(data, period) {
        if (data.length === 0) return [];
        const ema = [];
        const k = 2 / (period + 1);
        let sum = 0;
        const startIdx = Math.min(period, data.length);
        for (let i = 0; i < startIdx; i++) sum += data[i].value;
        let prevEma = sum / startIdx;
        ema.push({ time: data[startIdx - 1].time, value: +prevEma.toFixed(4) });
        for (let i = startIdx; i < data.length; i++) {
            prevEma = data[i].value * k + prevEma * (1 - k);
            ema.push({ time: data[i].time, value: +prevEma.toFixed(4) });
        }
        return ema;
    }

    function calculateStochastic(data, period, kPeriod, dPeriod) {
        period = period || 14;
        kPeriod = kPeriod || 3;
        dPeriod = dPeriod || 3;
        if (data.length < period) return { k: [], d: [] };
        const kValues = [];
        for (let i = period - 1; i < data.length; i++) {
            let high = -Infinity,
                low = Infinity;
            for (let j = i - period + 1; j <= i; j++) {
                if (data[j].high > high) high = data[j].high;
                if (data[j].low < low) low = data[j].low;
            }
            const range = high - low;
            const val = range === 0 ? 50 : ((data[i].close - low) / range) * 100;
            kValues.push({ time: data[i].time, value: +val.toFixed(2) });
        }
        const kSma = calculateSMAFromValues(kValues, kPeriod);
        const dSma = calculateSMAFromValues(kSma, dPeriod);
        return { k: kSma, d: dSma };
    }

    function calculateSMAFromValues(data, period) {
        if (data.length < period) return [];
        const sma = [];
        for (let i = period - 1; i < data.length; i++) {
            let sum = 0;
            for (let j = 0; j < period; j++) sum += data[i - j].value;
            sma.push({ time: data[i].time, value: +(sum / period).toFixed(2) });
        }
        return sma;
    }

    function calculateVWAP(data) {
        if (data.length === 0) return [];
        let cumVolume = 0,
            cumPriceVolume = 0;
        const vwap = [];
        for (let i = 0; i < data.length; i++) {
            const typical = (data[i].high + data[i].low + data[i].close) / 3;
            cumVolume += data[i].volume;
            cumPriceVolume += typical * data[i].volume;
            const val = cumVolume === 0 ? data[i].close : cumPriceVolume / cumVolume;
            vwap.push({ time: data[i].time, value: +val.toFixed(4) });
        }
        return vwap;
    }

    // ─── SIMULATED DATA GENERATION (fallback) ──────────────────
    function generateSeamlessSimulatedCandles(sym, count, targetPrice, intervalSec) {
        const candles = [];
        const now = Math.floor(Date.now() / 1000);
        let price = targetPrice * 0.98;
        for (let i = count - 1; i >= 0; i--) {
            const time = now - (i + 1) * intervalSec;
            const open = price;
            const progress = (count - i) / count;
            const target = targetPrice * 0.98 + (targetPrice * 0.02) * progress;
            const change = (target - open) * (0.1 + Math.random() * 0.4);
            const close = i === 0 ? targetPrice : open + change;
            const high = Math.max(open, close) + Math.abs(change) * 0.2;
            const low = Math.min(open, close) - Math.abs(change) * 0.2;
            const volume = Math.floor(50000 + Math.random() * 200000);
            candles.push({ time: time, open: +open.toFixed(4), high: +high.toFixed(4), low: +low.toFixed(4),
                close: +close.toFixed(4), volume: volume });
            price = close;
        }
        candles.sort((a, b) => a.time - b.time);
        simLastPrices[sym] = targetPrice;
        simBasePrices[sym] = targetPrice;
        simPrevClosePrices[sym] = targetPrice * 0.98;
        return candles;
    }

    let lazyAllCandles = [];
    let lazyVisibleStart = 0;
    let lazyVisibleEnd = 0;

    function initLazy(candles) {
        lazyAllCandles = candles.slice();
        const total = lazyAllCandles.length;
        lazyVisibleEnd = Math.min(total, 5000);
        lazyVisibleStart = Math.max(0, lazyVisibleEnd - 5000);
        return lazyAllCandles.slice(lazyVisibleStart, lazyVisibleEnd);
    }

    // ─── TRADING ENGINE ──────────────────────────────────────────
    function checkAndExecuteSLTP() {
        if (!portfolio || !portfolio.positions) return;
        let changed = false;
        const toRemove = [];
        for (let i = 0; i < portfolio.positions.length; i++) {
            const p = portfolio.positions[i];
            let price = simLastPrices[p.symbol] || p.currentPrice || p.entryPrice;
            if (!isValidNumber(price) || price <= 0) continue;
            p.currentPrice = price;
            const isShort = p.type === 'short';
            let triggered = false;
            let reason = '';
            let closePrice = price;
            if (p.slPrice && isValidNumber(p.slPrice) && p.slPrice > 0) {
                if ((!isShort && price <= p.slPrice) || (isShort && price >= p.slPrice)) {
                    triggered = true;
                    reason = 'Stop Loss';
                    closePrice = p.slPrice;
                }
            }
            if (!triggered && p.tpPrice && isValidNumber(p.tpPrice) && p.tpPrice > 0) {
                if ((!isShort && price >= p.tpPrice) || (isShort && price <= p.tpPrice)) {
                    triggered = true;
                    reason = 'Take Profit';
                    closePrice = p.tpPrice;
                }
            }
            if (triggered) {
                const pnl = isShort ? (p.entryPrice - closePrice) * p.qty : (closePrice - p.entryPrice) * p
                    .qty;
                if (isShort) {
                    portfolio.cash += (p.blockedMargin || (p.qty * p.entryPrice * 0.5)) + pnl;
                } else {
                    portfolio.cash += p.qty * closePrice;
                }
                const tx = {
                    type: 'close',
                    symbol: p.symbol,
                    qty: p.qty,
                    price: closePrice,
                    time: new Date().toISOString(),
                    reason: reason,
                    pnl: pnl,
                    netPnl: pnl,
                    id: p.id,
                    entryPrice: p.entryPrice,
                    typeLabel: p.type,
                    closePrice: closePrice
                };
                portfolio.transactions.unshift(tx);
                sendNotification('🛑 ' + reason, p.symbol + ' @ $' + closePrice.toFixed(4) + ' | P&L: ' +
                    pnl.toFixed(2), pnl >= 0 ? 'success' : 'error');
                playTradeSound('sell');
                removePositionLines(p.id);
                toRemove.push(i);
                changed = true;
            }
        }
        if (changed) {
            portfolio.positions = portfolio.positions.filter((_, i) => !toRemove.includes(i));
            savePortfolioToStorage();
            updateSimUI();
            redrawAllLines();
            syncPortfolioToServer();
            updateHistoryUI();
        }
    }

    function checkPendingOrders() {
        if (pendingOrders.length === 0) return;
        const toRemove = [];
        for (let i = 0; i < pendingOrders.length; i++) {
            const order = pendingOrders[i];
            if (order.status !== 'pending') { toRemove.push(i); continue; }
            const price = simLastPrices[order.symbol] || simBasePrices[order.symbol];
            if (!isValidNumber(price)) continue;
            const hit = order.side === 'buy' ? price <= order.price : price >= order.price;
            if (hit) {
                const qty = order.qty;
                const execPrice = order.price;
                if (order.side === 'buy') {
                    const cost = qty * execPrice;
                    if (portfolio.cash < cost) {
                        sendNotification('⚠️ Insufficient cash', 'Limit order ' + order.symbol + ' canceled',
                            'warning');
                        order.status = 'canceled';
                        toRemove.push(i);
                        continue;
                    }
                    portfolio.cash -= cost;
                    const newPos = {
                        id: 'pos_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        symbol: order.symbol,
                        type: 'long',
                        qty: qty,
                        entryPrice: execPrice,
                        currentPrice: execPrice,
                        slPrice: null,
                        tpPrice: null,
                        openTime: new Date().toISOString()
                    };
                    portfolio.positions.push(newPos);
                    portfolio.transactions.unshift({
                        type: 'buy',
                        symbol: order.symbol,
                        qty: qty,
                        price: execPrice,
                        time: new Date().toISOString(),
                        reason: 'Limit Order',
                        entryPrice: execPrice,
                        typeLabel: 'long'
                    });
                    sendNotification('✅ Limit BUY Executed', order.symbol + ' @ $' + execPrice.toFixed(4),
                        'success');
                    playTradeSound('buy');
                    drawEntryLine(order.symbol, execPrice, 'long');
                } else {
                    const margin = qty * execPrice * 0.5;
                    if (portfolio.cash < margin) {
                        sendNotification('⚠️ Insufficient margin', 'Short limit order ' + order.symbol +
                            ' canceled', 'warning');
                        order.status = 'canceled';
                        toRemove.push(i);
                        continue;
                    }
                    portfolio.cash -= margin;
                    const newPos = {
                        id: 'pos_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        symbol: order.symbol,
                        type: 'short',
                        qty: qty,
                        entryPrice: execPrice,
                        currentPrice: execPrice,
                        slPrice: null,
                        tpPrice: null,
                        openTime: new Date().toISOString(),
                        blockedMargin: margin
                    };
                    portfolio.positions.push(newPos);
                    portfolio.transactions.unshift({
                        type: 'sell',
                        symbol: order.symbol,
                        qty: qty,
                        price: execPrice,
                        time: new Date().toISOString(),
                        reason: 'Limit Order (Short)',
                        entryPrice: execPrice,
                        typeLabel: 'short',
                        blockedMargin: margin
                    });
                    sendNotification('✅ Limit SHORT Executed', order.symbol + ' @ $' + execPrice.toFixed(
                        4), 'success');
                    playTradeSound('sell');
                    drawEntryLine(order.symbol, execPrice, 'short');
                }
                order.status = 'filled';
                toRemove.push(i);
                savePortfolioToStorage();
                updateSimUI();
                redrawAllLines();
                syncPortfolioToServer();
                updateHistoryUI();
            }
        }
        if (toRemove.length) {
            pendingOrders = pendingOrders.filter((_, i) => !toRemove.includes(i));
            savePendingOrders();
            renderPendingOrdersUI();
        }
    }

                await apiFetch('/portfolio/sync', {
                    method: 'PUT',
                    body: JSON.stringify({
                        cash: portfolio.cash,
                        positions: portfolio.positions,
                        transactions: portfolio.transactions.slice(0, 500),
                        drawnLines: portfolio.drawnLines
                    })
                });
            } catch (e) { /* silent */ }
            syncTimeout = null;
        }, 3000);
    }

    function calcEquity() {
        let eq = portfolio.cash || 0;
        portfolio.positions.forEach(p => {
            const cp = simLastPrices[p.symbol] || p.currentPrice || p.entryPrice || 0;
            eq += Math.abs(p.qty) * cp;
        });
        return eq;
    }

    function calcTotalPL() {
        let pl = 0;
        portfolio.positions.forEach(p => {
            const cp = simLastPrices[p.symbol] || p.currentPrice || p.entryPrice || 0;
            pl += p.type === 'long' ? (cp - p.entryPrice) * p.qty : (p.entryPrice - cp) * p.qty;
        });
        return pl;
    }

    function exitPositionById(posId) {
        const idx = portfolio.positions.findIndex(p => p.id === posId);
        if (idx === -1) return;
        const p = portfolio.positions[idx];
        const price = simLastPrices[p.symbol] || p.currentPrice || p.entryPrice || 0;
        const isShort = p.type === 'short';
        const pnl = isShort ? (p.entryPrice - price) * p.qty : (price - p.entryPrice) * p.qty;
        if (isShort) {
            portfolio.cash += (p.blockedMargin || (p.qty * p.entryPrice * 0.5)) + pnl;
        } else {
            portfolio.cash += p.qty * price;
        }
        const tx = {
            type: 'close',
            symbol: p.symbol,
            qty: p.qty,
            price: price,
            time: new Date().toISOString(),
            reason: 'Manual Exit',
            pnl: pnl,
            netPnl: pnl,
            id: p.id,
            entryPrice: p.entryPrice,
            typeLabel: p.type,
            closePrice: price
        };
        portfolio.transactions.unshift(tx);
        removePositionLines(p.id);
        portfolio.positions.splice(idx, 1);
        savePortfolioToStorage();
        updateSimUI();
        redrawAllLines();
        syncPortfolioToServer();
        updateHistoryUI();
        sendNotification('🚪 Position Closed', p.symbol + ' @ $' + price.toFixed(4) + ' | P&L: ' + pnl
            .toFixed(2), pnl >= 0 ? 'success' : 'error');
        playTradeSound('sell');
        showToast('🚪 Exited ' + p.symbol + ' @ $' + price.toFixed(4) + ' | P&L: ' + pnl.toFixed(2));
        document.querySelectorAll('.modal').forEach(m => m.remove());
    }

    // ─── ORDER PLACEMENT ─────────────────────────────────────────
    function placeSimOrder(type, orderType, limitPrice) {
        orderType = orderType || 'market';
        const symbol = document.getElementById('symbolSelect')?.value || simCurrentSymbol;
        const qty = parseFloat(document.getElementById('orderQty')?.value) || 0.01;
        if (!qty || qty <= 0) return showToast('❌ Invalid quantity');
        let price = simLastPrices[symbol] || simBasePrices[symbol] || 150;
        if (!isValidNumber(price)) price = 150;

        if (orderType === 'limit') {
            if (!limitPrice || limitPrice <= 0) return showToast('❌ Invalid limit price');
            if (type === 'buy' && portfolio.cash < qty * limitPrice) return showToast(
                '❌ Insufficient cash for limit order');
            if (type === 'sell' && portfolio.cash < qty * limitPrice * 0.5) return showToast(
                '❌ Insufficient margin for short limit');
            const order = {
                id: 'limit_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                symbol: symbol,
                side: type,
                type: 'limit',
                price: limitPrice,
                qty: qty,
                status: 'pending',
                createdAt: Date.now()
            };
            pendingOrders.push(order);
            savePendingOrders();
            renderPendingOrdersUI();
            sendNotification('📌 Limit Order Placed', type.toUpperCase() + ' ' + qty + ' ' + symbol + ' @ $' +
                limitPrice.toFixed(4), 'info');
            showToast('📌 Limit ' + type.toUpperCase() + ' placed @ $' + limitPrice.toFixed(4));
            return;
        }

        if (type === 'buy') {
            const cost = qty * price;
            if (portfolio.cash < cost) return showToast('❌ Insufficient cash');
            portfolio.cash -= cost;
            const newPos = {
                id: 'pos_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                symbol: symbol,
                type: 'long',
                qty: qty,
                entryPrice: price,
                currentPrice: price,
                slPrice: null,
                tpPrice: null,
                openTime: new Date().toISOString()
            };
            portfolio.positions.push(newPos);
            portfolio.transactions.unshift({
                type: 'buy',
                symbol: symbol,
                qty: qty,
                price: price,
                time: new Date().toISOString(),
                reason: 'Market Order',
                entryPrice: price,
                typeLabel: 'long'
            });
            sendNotification('✅ Market BUY', qty + ' ' + symbol + ' @ $' + price.toFixed(4), 'success');
            playTradeSound('buy');
            showToast('✅ Market BUY ' + qty + ' ' + symbol + ' @ $' + price.toFixed(4));
            drawEntryLine(symbol, price, 'long');
        } else {
            const margin = qty * price * 0.5;
            if (portfolio.cash < margin) return showToast('❌ Insufficient margin for short');
            portfolio.cash -= margin;
            const newPos = {
                id: 'pos_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                symbol: symbol,
                type: 'short',
                qty: qty,
                entryPrice: price,
                currentPrice: price,
                slPrice: null,
                tpPrice: null,
                openTime: new Date().toISOString(),
                blockedMargin: margin
            };
            portfolio.positions.push(newPos);
            portfolio.transactions.unshift({
                type: 'sell',
                symbol: symbol,
                qty: qty,
                price: price,
                time: new Date().toISOString(),
                reason: 'Market Order (Short)',
                entryPrice: price,
                typeLabel: 'short',
                blockedMargin: margin
            });
            sendNotification('✅ Market SHORT', qty + ' ' + symbol + ' @ $' + price.toFixed(4), 'success');
            playTradeSound('sell');
            showToast('✅ Market SHORT ' + qty + ' ' + symbol + ' @ $' + price.toFixed(4));
            drawEntryLine(symbol, price, 'short');
        }
        savePortfolioToStorage();
        updateSimUI();
        redrawAllLines();
        syncPortfolioToServer();
        updateHistoryUI();
    }
